<svg xmlns="http://www.w3.org/2000/svg" width="500" height="200" viewBox="0 0 500 200">
  <!-- Add-on logo (rendered to /logo.png): a phone controlling a group of speakers. Original artwork. -->
  <defs>
    <linearGradient id="banner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <g id="speaker">
      <rect x="0" y="0" width="68" height="104" rx="14" fill="#ffffff"/>
      <circle cx="34" cy="26" r="9" fill="#5b3fe0"/>
      <circle cx="34" cy="70" r="21" fill="#5b3fe0"/>
      <circle cx="34" cy="70" r="8" fill="#ffffff"/>
    </g>
  </defs>
  <rect x="0" y="0" width="500" height="200" rx="44" fill="url(#banner)"/>
  <g transform="translate(6 -5)">
    <!-- phone -->
    <rect x="56" y="42" width="60" height="104" rx="12" fill="#ffffff"/>
    <rect x="63" y="53" width="46" height="74" rx="6" fill="#4f46e5"/>
    <path d="M80 77 L80 103 L101 90 Z" fill="#5eead4" stroke="#5eead4" stroke-width="3" stroke-linejoin="round"/>
    <rect x="77" y="134" width="18" height="5" rx="2.5" fill="#5b3fe0"/>
    <!-- signal -->
    <g fill="none" stroke="#5eead4" stroke-width="9" stroke-linecap="round">
      <path d="M139.3 76.6 A26 26 0 0 1 139.3 111.4"/>
      <path d="M154.2 63.2 A46 46 0 0 1 154.2 124.8"/>
    </g>
    <!-- a group of speakers -->
    <use href="#speaker" x="196" y="42"/>
    <use href="#speaker" x="280" y="42"/>
    <use href="#speaker" x="364" y="42"/>
    <rect x="196" y="160" width="236" height="8" rx="4" fill="#5eead4"/>
  </g>
</svg>

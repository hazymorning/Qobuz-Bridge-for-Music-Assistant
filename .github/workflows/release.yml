name: Release

# Every version in config.json that reaches main gets a GitHub release, once, with its
# CHANGELOG.md section as the notes. Home Assistant itself only reads config.json.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release the add-on version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Publish the release if it is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version config.json)
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released"
            exit 0
          fi
          awk -v heading="## $version" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no '## $version' section" >&2
            exit 1
          fi
          gh release create "v$version" --target "$GITHUB_SHA" --title "$version" --notes-file notes.md

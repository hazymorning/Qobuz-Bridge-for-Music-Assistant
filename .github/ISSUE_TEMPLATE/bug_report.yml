name: Bug report
description: Something isn't working the way it should
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: |
        What did you do and what went wrong? Please mention the add-on version (on the add-on page in
        Home Assistant), your Music Assistant version, the speaker or group you played on, and the
        Qobuz app you were using.
      placeholder: |
        Playing an album from the iOS Qobuz app to "Kitchen (MA)", a Sonos group in Music Assistant
        2.10.7. Skipping twice quickly stops playback. Add-on 0.2.0.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        The add-on's **Log** tab from around the time it happened. For more detail set **Log level**
        to `debug` on the **Configuration** tab, restart the add-on and reproduce. INFO logs help too.
      render: text
    validations:
      required: false

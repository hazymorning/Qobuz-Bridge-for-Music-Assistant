[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qobuz-proxy"
version = "1.7.7"
description = "Headless Qobuz music player service with DLNA support"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "leolobato"}]
keywords = ["qobuz", "dlna", "music", "streaming", "sonos", "heos", "upnp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Multimedia :: Sound/Audio",
]

dependencies = [
    "websockets>=12.0",
    "protobuf>=4.25.0",
    "aiohttp>=3.9.0",
    "zeroconf>=0.131.0",
    "async-upnp-client>=0.38.0",
    "pyyaml>=6.0",
    "pyjwt>=2.8.0",
]

[project.urls]
Repository = "https://github.com/leolobato/qobuz-proxy"
"Bug Tracker" = "https://github.com/leolobato/qobuz-proxy/issues"

# Optional runtime feature: the local (PortAudio) audio backend.
[project.optional-dependencies]
local = [
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "soundfile>=0.12.1",
]
# Optional runtime feature: the Music Assistant backend. The official client
# needs Python 3.13+, so the extra is empty on older interpreters.
music-assistant = [
    "music-assistant-client>=1.6.0,<2; python_version >= '3.13'",
]

# Development tooling (PEP 735 dependency group). uv installs the `dev` group
# by default on `uv sync` — see [tool.uv].default-groups below.
[dependency-groups]
dev = [
    "qobuz-proxy[music-assistant]",  # the tests drive the Music Assistant backend
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-xdist>=3",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
qobuz-proxy = "qobuz_proxy.cli:main"

# uv manages the local environment (.venv + uv.lock).
[tool.uv]
package = true                 # build & install this project (editable) into the env
default-groups = ["dev"]       # `uv sync` includes the dev group unless --no-dev

[tool.setuptools.packages.find]
where = ["."]
include = ["qobuz_proxy*"]

[tool.setuptools.package-data]
"qobuz_proxy.webui" = ["static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"qobuz_proxy/__init__.py" = ["E402"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_ignores = true
exclude = ["qobuz_proxy/proto/"]

# The Music Assistant packages are checked against their own types (they need the
# python_version above), even if a release ships without its py.typed marker.
[[tool.mypy.overrides]]
module = ["music_assistant_client", "music_assistant_client.*", "music_assistant_models", "music_assistant_models.*"]
follow_untyped_imports = true

# The generated protobuf code (excluded above) and the optional local-audio libraries, which
# `uv sync` leaves out
[[tool.mypy.overrides]]
module = ["qobuz_proxy.proto.*", "sounddevice", "numpy"]
follow_imports = "skip"
ignore_missing_imports = true

# Type errors inherited from upstream QobuzProxy, left as they are so upstream changes merge cleanly
[[tool.mypy.overrides]]
module = [
    "qobuz_proxy.backends.dlna.proxy_server",
    "qobuz_proxy.backends.local.backend",
    "qobuz_proxy.connect.discovery",
    "qobuz_proxy.connect.ws_manager",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["qobuz_proxy.speaker"]
disable_error_code = ["arg-type", "misc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # Upstream code: its web app uses plain string keys, its Qobuz websocket reads close codes
    "ignore::aiohttp.web_exceptions.NotAppKeyWarning",
    "ignore:ConnectionClosed.(code|reason) is deprecated:DeprecationWarning",
]
